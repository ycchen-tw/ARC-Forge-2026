  - id: pattern_completion
    name_zh: "pattern completion"
    axis: operation
    definition_zh: "Filling in damaged, occluded or unfinished parts according to an existing symmetry/periodicity. Limited to completion based on symmetry/periodicity; filling gaps in straight lines belongs to draw_line. Corresponds to ConceptARC CompleteShape (together with symmetry_detection / periodicity)."
    aliases:
      - "shape completion"
      - "pattern completion"
      - "pattern reconstruction"
      - "symmetry repair"
      - "fill missing"
