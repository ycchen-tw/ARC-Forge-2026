  - id: rectangle_detection
    name_zh: "rectangle/block detection"
    axis: perception
    definition_zh: "Seeing solid or hollow rectangles and blocks (2x2 blocks included). General shapes, see shape_recognition."
    aliases:
      - "rectangle detection"
      - "2x2 block detection"
      - "2x2 block structure"
      - "3x3 square placement"
      - "background shape detection"
    examples: ["3eda0437", "6cf79266"]
  - id: topology_holes
    name_zh: "topology/holes"
    axis: perception
    definition_zh: "Seeing topological features of objects: whether they have holes inside, whether they are closed, connectivity. Empty areas outside objects enclosed by walls, see enclosed_region."
