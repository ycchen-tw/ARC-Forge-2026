  - id: swap
    name_zh: "swap"
    axis: operation
    definition_zh: "Swapping two colors, two objects or two positions. One-way color change, see recolor."
    aliases:
      - "swap"
      - "exchange"
      - "swap colors"
      - "swap positions"
    examples: []
  - id: overlay
    name_zh: "overlay"
    axis: operation
    definition_zh: "Stacking two (or more) layers/sub-images to produce the output (the later one covers, or they are composed by a rule). Composing with boolean logic, see boolean_ops."
    aliases:
      - "overlap (op)"
      - "overlay"
      - "superimpose"
      - "merge layers"
    examples: ["045e512c"]
  - id: concatenate
    name_zh: "concatenation"
    axis: operation
    definition_zh: "Placing several sub-images or the input side by side/stacked to form a larger output. Regular tiled repetition, see tiling."
    aliases:
      - "concatenate"
      - "stacking"
      - "join grids"
      - "side by side"
    examples: []
  - id: fractal_replication
    name_zh: "fractal self-replication"
    axis: operation
    definition_zh: "Using the input as the tile and placing a reduced copy of the input at each position where the input itself has a pixel, forming a fractal (e.g., 007bbfb7). Tile and layout must be the same pattern; placing pattern A by mask B is copy + color_as_instruction. Plain integer enlargement, see scaling; regular tiling, see tiling."
    aliases:
      - "fractal"
      - "self-replication"
      - "recursive tiling"
      - "self-similar scaling"
    examples: []
  - id: align
    name_zh: "alignment"
    axis: operation
    definition_zh: "Moving objects so they line up with an axis, a reference object or each other (aligned by edge or by color). Merely detecting relative positions, see spatial_relation."
    aliases:
      - "alignment"
      - "alignment by color"
      - "copy to object border (align)"
      - "bounding box alignment"
      - "border pixel alignment"
    examples: ["1caeab9d", "1f642eb9", "a8c38be5"]
  - id: remap_positions
    name_zh: "coordinate remapping"
    axis: operation
    definition_zh: "Moving individual pixels/units point by point to new output positions by a fixed coordinate correspondence (a rearrangement that no whole translation/rotation/scaling/crop describes)."
    aliases:
      - "coordinate remapping"
      - "position permutation"
      - "rearrangement"
      - "fixed position mapping"
    examples: []
  - id: distance_field
    name_zh: "distance-field coloring"
    axis: operation
    definition_zh: "Processing each cell in layers by its distance to a reference point/wall/boundary (concentric-ring coloring, distance gradients, ripple spreading). Plain outward extension, see expansion."
    aliases:
      - "distance-based coloring"
      - "concentric rings"
      - "distance layers"
      - "wavefront"
    examples: []
  - id: substitute
    name_zh: "substitute/replace"
    axis: operation
    definition_zh: "Replacing one shape/pattern as a whole with another (by a correspondence), not just changing its color. Pure color change, see recolor; reading the mapping rule, see color_mapping."
    aliases:
      - "substitution"
      - "block substitution"
      - "pattern substitution"
      - "replace object"
      - "shape substitution"
    examples: []

  # ====================================================================
  # ABSTRACT: higher-level reasoning patterns
  # ====================================================================
  - id: counting
    name_zh: "counting"
    axis: abstract
    definition_zh: "Counting objects, pixels or events as the key to the solution. Corresponds to ConceptARC Count. Using the count to determine the output, see count_and_map."
    aliases:
      - "counting"
      - "count"
      - "frequency counting (reasoning)"
      - "tally"
    examples: ["1190e5a7", "1fad071e", "29623171"]
  - id: count_and_map
    name_zh: "count and map"
    axis: abstract
    definition_zh: "Counting first, then letting the number determine the output (repeat N times, pick a color by count, increasing sequence). Pure counting, see counting; when the count only determines the output size, label output_size_rule, not this concept."
    aliases:
      - "incrementing"
      - "count to size"
      - "count to color"
      - "repeat N times"
      - "count-based output"
    examples: ["bbc9ae5d"]
  - id: color_mapping
    name_zh: "color mapping rule"
    axis: abstract
    definition_zh: "Inferring a 'color -> color' lookup dictionary and applying it (often learned from a legend or the examples). The recoloring action, see recolor; reading a legend region, see legend_key."
    aliases:
      - "color mapping"
      - "color correspondence"
      - "color mapping application"
      - "color dictionary"
      - "color→color"
    examples: ["0d3d703e", "3e980e27", "7c008303"]
  - id: color_as_instruction
    name_zh: "color/pixel as instruction"
    axis: abstract
    definition_zh: "Treating a special color or marker pixel as an 'instruction/pointer' that decides which action to take or where it points. Reading a lookup table, see color_mapping."
    aliases:
      - "color guide"
      - "indicator pixels"
      - "colors as indicators"
      - "boolean indicator"
      - "anchor marker"
      - "key pixel"
      - "pointer"
    examples: ["09629e4f", "0b148d64", "6ecd11f4"]
  - id: boolean_ops
    name_zh: "boolean/set operations"
    axis: abstract
    definition_zh: "Applying cell-wise boolean or set operations such as AND / OR / XOR / NOT to two (or more) panels or layers to get the result. Cutting out the panels, see panel_separation."
    aliases:
      - "boolean logical operations"
      - "bitmasks with separator (logic)"
      - "AND"
      - "OR"
      - "XOR"
      - "pixel-wise comparison"
      - "arithmetic intersection"
      - "set operations"
    examples: ["0520fde7", "1b2d62fb", "3428a4f5"]
  - id: same_different
    name_zh: "same/different judgment"
    axis: abstract
    definition_zh: "Comparing whether objects/panels/regions are the same or different and deciding the output accordingly. Corresponds to ConceptARC SameDifferent. Finding the only one that differs, see find_exception."
    aliases:
      - "same/different"
      - "sameness"
      - "difference detection"
      - "equality check"
    examples: ["776ffc46"]
  - id: find_exception
    name_zh: "find the unique one/exception"
    axis: abstract
    definition_zh: "Finding, among a group of similar objects, the only one that differs (or the only one that matches) as the answer. ConceptARC SameDifferent also involves this."
    aliases:
      - "uniqueness"
      - "odd one out"
      - "the different one"
      - "distracters (target)"
      - "unique object"
    examples: ["31aa019c"]
  - id: object_selection
    name_zh: "select object by attribute"
    axis: abstract
    definition_zh: "Picking the target object by a comparable attribute (largest/smallest, most/fewest, a specific color/shape). Outputting it after picking, see extract_object; sorting, see ordering; finding the exception, see find_exception."
    aliases:
      - "select largest"
      - "select smallest"
      - "pick by property"
      - "biggest object"
      - "most common shape"
    examples: []
  - id: majority_vote
    name_zh: "majority vote"
    axis: abstract
    definition_zh: "Taking the most frequent color/shape/pattern as the correct answer (the minority is treated as noise). Pure color statistics, see color_statistics."
    aliases:
      - "majority"
      - "most common"
      - "voting"
      - "denoise by majority"
    examples: []
  - id: pattern_matching
    name_zh: "pattern matching"
    axis: abstract
    definition_zh: "Matching a pattern/shape against a template or another location (including fitting puzzle pieces, finding matching places). Learning a color mapping, see color_mapping."
    aliases:
      - "pattern matching"
      - "pattern recognition"
      - "shape matching"
      - "template matching"
      - "color matching"
      - "puzzle pieces (match)"
    examples: ["995c5fa3", "3e980e27", "ce602527"]
  - id: correspondence_pairing
    name_zh: "pairwise correspondence"
    axis: abstract
    definition_zh: "Setting up pairwise correspondences between objects, positions or panels (A maps to B, mapping by position), then transforming accordingly. A pure color dictionary, see color_mapping."
    aliases:
      - "correspondence"
      - "pairing"
      - "relative coordinate mapping"
      - "color correspond to position"
      - "position mapping"
      - "one-to-one"
    examples: ["3e980e27", "7c008303", "995c5fa3"]
  - id: ordering
    name_zh: "ordering"
    axis: abstract
    definition_zh: "Sorting objects by size, count, color, etc., or processing them in order. Corresponds to ConceptARC Order. Measuring size, see size_measure."
    aliases:
      - "sorting"
      - "order"
      - "ranking"
      - "area sorting"
      - "fill in order"
      - "sequence by size"
    examples: ["08ed6ac7", "8e1813be"]
  - id: conditional_rule
    name_zh: "conditional branching"
    axis: abstract
    definition_zh: "Choosing essentially different actions or output templates depending on whether a condition holds (if-then, binary output, case splits). Termination/selection semantics built into a transformation, such as 'extend until an obstacle, then stop' or 'keep the selected one, recolor the rest', do not count."
    aliases:
      - "conditional"
      - "if-then"
      - "binary output based on condition"
      - "condition"
      - "rule branching"
    examples: []
  - id: rule_composition
    name_zh: "rule composition"
    axis: abstract
    definition_zh: "Solving requires combining, chaining or applying several sub-rules in stages (not a single transformation)."
    aliases:
      - "rule composition"
      - "multi-step rule"
      - "compositional"
      - "combined rules"
    examples: []
  - id: pathfinding
    name_zh: "path/maze"
    axis: abstract
    definition_zh: "Finding a connected path through a maze or obstacles (shortest path, obstacle avoidance, reaching the exit). The action of drawing the segments, see draw_line."
    aliases:
      - "path finding"
      - "maze"
      - "obstacle avoidance"
      - "shortest path"
      - "route"
    examples: ["2dd70a9a", "b782dc8a", "d9f24cd1"]
  - id: grouping
    name_zh: "grouping/clustering"
    axis: abstract
    definition_zh: "Grouping objects by a shared attribute (color, shape, position), then processing each group separately."
    aliases:
      - "grouping"
      - "clustering"
      - "categorize"
      - "group by property"
    examples: []
  - id: sequence_progression
    name_zh: "sequence/progression"
    axis: abstract
    definition_zh: "Recognizing and continuing a sequence rule: increasing, alternating, cyclic, staircase progression, etc. Plain translational repetition, see periodicity; increasing counts, see count_and_map."
    aliases:
      - "color sequence"
      - "alternating pattern"
      - "progression"
      - "arithmetic sequence"
      - "staircase progression"
      - "incrementing sequence"
    examples: ["e21d9049", "ff28f65a"]
  - id: simulation
    name_zh: "process simulation"
    axis: abstract
    definition_zh: "Treating the grid as a state and repeatedly applying a dynamic rule step by step (physical/procedural processes such as gravity, bouncing, diffusion, Game of Life). Single-step gravity/bouncing, see gravity / bounce."
    aliases:
      - "simulation"
      - "step-by-step process"
      - "iterative rule"
      - "dynamics"
      - "physics simulation"
    examples: []
  - id: output_size_rule
    name_zh: "output size reasoning"
    axis: abstract
    definition_zh: "The output grid differs in size from the input, and solving requires inferring the rule that sets the size (by object count, by content, by scale factor, etc.). Not labeled when the size is the same or obvious (e.g., a crop result)."
    aliases:
      - "output size determination"
      - "grid size rule"
      - "output dimensions"
      - "size inference"
    examples: []
  - id: analogy_transfer
    name_zh: "analogical transfer"
    axis: abstract
    definition_zh: "Observing a demonstration of a transformation in one place in the grid, then applying the same transformation elsewhere (copying by example)."
    aliases:
      - "analogy"
      - "transfer transformation"
      - "apply demonstrated rule"
      - "copy transformation"
    examples: []

