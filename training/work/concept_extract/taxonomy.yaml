# Controlled vocabulary of ARC-AGI solving concepts (controlled taxonomy)
# Three axes: perception / operation / abstract (abstract logic)
# Each concept belongs to exactly one axis. When labeling, one task may carry several concepts.
metadata:
  version: v2
  purpose: "For labeling which solving concepts each of the 514 ARC tasks needs"
  changelog_v2: "Revised after the 16-task double-labeled pilot + a full-text fork check: 8 definitions tightened (recolor/conditional_rule/count_and_map/fractal_replication/pattern_completion/grid_partition/background_identification); added remap_positions, distance_field (operation)"
  sources:
    - "barc: 144 hand-curated concepts (with occurrence counts and task_ids), the most reliable vocabulary base"
    - "nvarc_free_text: 550 concepts freely generated by an LLM; the frequent and general ones were taken, the rest serve as synonym material"
    - "conceptarc_groups: the 16 concept groups of the ConceptARC paper; the taxonomy must cover all of them"
  axis_counts:
    perception: 26
    operation: 27
    abstract: 20
    total: 73
  notes_zh: "aliases hold the original BARC/nvarc surface forms (mostly English) for later alignment; examples are BARC task_ids from raw_vocab"

concepts:
  # ====================================================================
  # PERCEPTION: what the solver needs to "see"
  # ====================================================================
  - id: object_detection
    name_zh: "object recognition/segmentation"
    axis: perception
    definition_zh: "Seeing the discrete objects in the grid formed by adjacent same-color pixels (4- or 8-connected). Label this whenever the grid must first be split into individual objects before processing. The connectivity parameter (4/8) stays in the aliases."
    aliases:
      - "objects"
      - "object detection"
      - "detect objects"
      - "connected components"
      - "connectivity"
      - "decomposition"
      - "4-connected components"
      - "4-directional connectivity"
      - "axis-aligned connectivity"
    examples: ["025d127b", "0e206a2e", "137eaa0f"]
  - id: object_template
    name_zh: "repeated motif/sprite"
    axis: perception
    definition_zh: "Seeing a same-shape motif that recurs in the grid (sprite / motif / puzzle piece); these units are moved, compared or counted as a whole. Excludes plain periodic tiling (see periodicity)."
    aliases:
      - "sprites"
      - "puzzle pieces"
      - "puzzle piece"
      - "motif"
      - "template"
    examples: ["045e512c", "72ca375d", "57aa92db"]
  - id: background_identification
    name_zh: "background identification"
    axis: perception
    definition_zh: "Determining which color is the background (not necessarily black 0) so the foreground objects can be separated from it. Not labeled when the background is plainly black (0) and unambiguous."
    aliases:
      - "non-black background"
      - "background (black 0) separation"
      - "background and foreground"
      - "background removal"
    examples: ["2bcee788", "2c608aff", "41e4d17e"]
  - id: color_statistics
    name_zh: "color statistics"
    axis: perception
    definition_zh: "Statistical observations about colors: which colors appear, how often each occurs, the most/least frequent color, the dominant color. Pure color counting belongs here; mapping from count results, see counting / count_and_map."
    aliases:
      - "color"
      - "colors"
      - "frequency counting"
      - "counting colored pixels per region"
      - "dominant color"
      - "least common color"
    examples: ["3618c87e", "6e82a1ae", "d4a91cb9"]
  - id: symmetry_detection
    name_zh: "symmetry detection"
    axis: perception
    definition_zh: "Seeing that the grid has mirror symmetry (horizontal/vertical/diagonal) or rotational symmetry. The axis direction stays in the aliases. Translational periodicity, see periodicity."
    aliases:
      - "symmetry"
      - "symmetries"
      - "symmetry detection"
      - "mirror symmetry"
      - "rotational symmetry"
      - "reflection symmetry"
    examples: ["1b60fb0c", "3345333e", "4c5c2cf0"]
  - id: periodicity
    name_zh: "periodicity/repeating pattern"
    axis: perception
    definition_zh: "Seeing a pattern repeat by translation along a direction (tiled periodicity, alternating stripes, translational symmetry). Used to detect the repeating unit or infer occluded parts. Plain mirror symmetry, see symmetry_detection."
    aliases:
      - "repetition"
      - "repeating patterns"
      - "repeating pattern"
      - "patterns"
      - "translational symmetry"
      - "periodic repetition"
      - "pixel patterns"
      - "pixel pattern"
      - "constant pattern"
      - "alternating pattern"
      - "color alternation"
      - "checkerboard pattern propagation"
    examples: ["045e512c", "05269061", "0a938d79"]
  - id: grid_partition
    name_zh: "grid/block partition"
    axis: perception
    definition_zh: "Seeing the grid cut into regular rectangular cells/regions (checkerboard, quadrants, rectangular partitions), each processed on its own. When the partition is made of separator lines, prefer panel_separation; label both only when the 'array of equal-size blocks' structure itself is key to the solution."
    aliases:
      - "rectangular cells"
      - "rectangular regions"
      - "rectangular partitions"
      - "quadrant decomposition"
      - "grid"
      - "regions"
      - "cell-wise independent processing"
    examples: ["06df4c85", "09629e4f", "0b148d64"]
  - id: panel_separation
    name_zh: "separator lines/multiple panels"
    axis: perception
    definition_zh: "Seeing the grid cut by one or more separator lines into several sub-panels (common in tasks that apply a boolean operation to two panels)."
    aliases:
      - "bitmasks with separator"
      - "dividers"
      - "objects separated by lines"
      - "separator"
      - "barrier line"
      - "divider line"
    examples: ["0520fde7", "1b2d62fb", "3428a4f5"]
  - id: line_detection
    name_zh: "line/bar detection"
    axis: perception
    definition_zh: "Seeing horizontal lines, vertical lines, full-row/full-column bars, or grid-line structures. Diagonals, see diagonal."
    aliases:
      - "lines"
      - "line detection"
      - "horizontal/vertical bars"
      - "horizontal bars"
      - "vertical lines"
      - "bar detection"
      - "boundary lines"
    examples: ["23581191", "6e19193c", "8d510a79"]
  - id: diagonal
    name_zh: "diagonal"
    axis: perception
    definition_zh: "Seeing lines or pixel arrangements running along a 45-degree diagonal (anti-diagonals included)."
    aliases:
      - "diagonal lines"
      - "diagonal"
      - "anti-diagonal"
      - "45-degree line"
      - "diagonal corners"
    examples: ["05269061", "623ea044", "a78176bb"]
  - id: shape_recognition
    name_zh: "shape recognition"
    axis: perception
    definition_zh: "Recognizing specific geometric shape classes (triangle, cross, spiral, staircase, pyramid, L shape, box, etc.). Rectangles, see also rectangle_detection."
    aliases:
