  - id: occlusion
    name_zh: "occlusion/layers"
    axis: perception
    definition_zh: "Seeing that part of the grid is occluded/covered, or the layer order when several objects overlap (which is on top). Corresponds to ConceptARC TopBottom3D. Repairing occluded parts, see pattern_completion."
