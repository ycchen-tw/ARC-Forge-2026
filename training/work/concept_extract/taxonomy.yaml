    examples: ["a9f96cdd"]
  - id: boundary_detection
    name_zh: "boundary/edge identification"
    axis: perception
    definition_zh: "Seeing object outlines, the grid edge or frame-line positions. The action of drawing a border, see outline_border."
    aliases:
      - "boundary detection"
      - "borders"
      - "border detection"
      - "edge"
      - "boundary identification"
      - "framing (detection)"
