  - id: spatial_relation
    name_zh: "relative position"
    axis: perception
    definition_zh: "Seeing directional relative positions between objects: above/below, left/right, top/bottom. Corresponds to ConceptARC AboveBelow, TopBottom2D, HorizontalVertical (the position aspect)."
    aliases:
      - "position"
      - "relative position"
      - "above/below"
      - "top/bottom"
      - "left/right"
      - "relative coordinate mapping"
      - "alignment (detection)"
    examples: ["8e5a5113", "1caeab9d", "1f642eb9"]
  - id: center_detection
    name_zh: "center identification"
    axis: perception
    definition_zh: "Finding the center point/central axis of an object, a region or the grid. Corresponds to ConceptARC Center."
    aliases:
      - "center"
      - "center detection"
      - "base center identification"
      - "centering"
    examples: []
  - id: corner_detection
    name_zh: "corner identification"
    axis: perception
    definition_zh: "Seeing corner positions of the grid or of objects (the four corners, missing corners)."
    aliases:
      - "corner placement"
      - "diagonal corners"
