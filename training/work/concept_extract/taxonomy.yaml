  - id: move_to_contact
    name_zh: "move to contact"
    axis: operation
    definition_zh: "Moving an object in a direction until it hits another object, a wall or the boundary (magnetic snapping, attraction, sliding to the end, moving to the boundary). Corresponds to ConceptARC MoveToBoundary. Pure gravity, see gravity."
    aliases:
      - "magnetism"
      - "attraction"
      - "collision detection"
      - "collision"
      - "move to boundary"
      - "slide to contact"
      - "rightward gravity / sliding"
    examples: ["29c11459", "4093f84a", "56dc2b01"]
  - id: bounce
    name_zh: "bounce/reflected trajectory"
    axis: operation
    definition_zh: "Making a moving object or ray bounce off a boundary/obstacle, giving a zigzag trajectory (bounce simulation)."
    aliases:
      - "bouncing"
      - "bounce"
      - "ricochet"
      - "trajectory reflection"
    examples: ["508bd3b6", "a3df8b1e", "e179c5f4"]
  - id: draw_pattern
    name_zh: "draw pattern"
    axis: operation
    definition_zh: "Actively generating/drawing a new pattern (spiral, staircase, radial, geometric sequence, etc.) rather than moving existing pixels. Completing an existing pattern, see pattern_completion."
    aliases:
      - "pattern generation"
      - "pattern drawing"
      - "pixel pattern generation"
      - "draw pattern"
      - "geometric pattern generation"
