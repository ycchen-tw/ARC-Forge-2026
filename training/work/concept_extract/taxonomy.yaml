    name_zh: "legend/key region"
    axis: perception
    definition_zh: "Seeing a small region of the grid that serves as a 'legend/lookup table' stating the correspondence between colors or shapes. Interpreting its meaning, see color_as_instruction / color_mapping."
    aliases:
      - "legend"
      - "key"
      - "indicator region"
      - "color guide (region)"
    examples: []

  # ====================================================================
  # OPERATION: what transformation the solver needs to "do"
  # ====================================================================
  - id: recolor
    name_zh: "recolor"
    axis: operation
    definition_zh: "Changing certain pixels/objects to another color (by a fixed rule, position or condition). Limited to changing the color of existing non-background pixels; drawing new pixels on the background, see draw_line / draw_pattern / flood_fill. Learning a 'which color -> which color' mapping rule, see color_mapping; replacing a whole shape, see substitute."
    aliases:
      - "color change"
      - "color replacement"
      - "color substitution (pixel)"
      - "recolor"
      - "binary color inversion"
      - "color stripe"
      - "pixel manipulation"
      - "masking (recolor)"
    examples: ["045e512c", "08ed6ac7", "150deff5"]
  - id: translation
    name_zh: "translation/sliding"
    axis: operation
    definition_zh: "Translating an object along a direction to a new position (including repeated translation as instructed, sliding). Moving until it hits something, see move_to_contact; falling under gravity, see gravity."
    aliases:
      - "translation"
      - "translation5"
      - "sliding objects"
      - "sliding"
      - "move"
      - "movement"
      - "repeated translation"
      - "shift"
    examples: ["05f2a901", "1a07d186", "25ff71a9"]
  - id: rotation
    name_zh: "rotation"
    axis: operation
    definition_zh: "Rotating an object or the whole grid by 90/180/270 degrees. The angle stays in the aliases."
    aliases:
      - "rotation"
      - "rotate"
      - "90-degree clockwise rotation"
      - "rot90"
      - "rot180"
      - "rot270"
      - "clockwise rotation of values"
    examples: ["3e980e27", "6aa20dc0", "97a05b5b"]
  - id: reflection
    name_zh: "reflection/flip"
    axis: operation
    definition_zh: "Flipping an object or the grid about an axis (horizontal/vertical/diagonal). Completion into an overall symmetric figure, see pattern_completion."
    aliases:
      - "mirror"
      - "reflection"
      - "flip"
      - "flipping"
      - "mirror reflection"
    examples: ["6855a6e4", "9f236235", "b775ac94"]
  - id: scaling
    name_zh: "scaling"
    axis: operation
    definition_zh: "Enlarging or shrinking an object or the grid by an integer factor (including growing and downscaling). Fractal enlargement that uses the input itself as the tile, see fractal_replication."
    aliases:
      - "scaling"
      - "growing"
      - "downscaling"
      - "rescaling"
      - "resizing"
      - "upscaling"
      - "block compression"
      - "downscale"
    examples: ["0962bcdd", "178fcbfb", "25d487eb"]
  - id: expansion
    name_zh: "expansion/extension"
    axis: operation
    definition_zh: "Making pixels or objects extend outward, spread, shoot rays or stretch to a boundary/obstacle. Corresponds to ConceptARC ExtendToBoundary. Integer-factor enlargement, see scaling."
    aliases:
      - "expanding"
      - "expansion"
      - "pixel expanding"
      - "bar extension"
      - "extend to boundary"
      - "beam projection"
      - "infinite ray"
      - "ray"
      - "propagation"
      - "extension"
    examples: ["db93a21d", "feca6190", "e21d9049"]
  - id: tiling
    name_zh: "tiling/copy array"
    axis: operation
    definition_zh: "Repeating a unit or the whole grid as tiles to fill the output (mirrored/rotated variants possible). Copying a single object to specific places, see copy; the fractal form, see fractal_replication."
    aliases:
      - "tiling"
      - "pattern replication"
      - "block replication"
      - "replicate"
      - "repetition (op)"
    examples: []
  - id: copy
    name_zh: "copy object"
    axis: operation
    definition_zh: "Copying an object to another position or a marked spot (stamp-style placement). Corresponds to ConceptARC Copy. Filling the whole grid with tiles, see tiling."
    aliases:
